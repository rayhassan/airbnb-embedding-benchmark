[project]
name = "airbnb-embedding-benchmark"
version = "0.1.0"
description = "Voyage AI embedding model & Atlas Vector Search quantization benchmark on sample_airbnb"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "plotly>=5.20",
    "pymongo>=4.7",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
    "voyageai>=0.5",
]

